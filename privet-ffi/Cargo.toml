[package]
name = "privet-ffi"
description = "C FFI bridge for privet core engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["aws-lc-rs"]
ring = ["privet-core/ring"]
aws-lc-rs = ["privet-core/aws-lc-rs"]

[dependencies]
privet-core = { path = "../privet-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
