[package]
name = "privet-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "privetd"
path = "src/main.rs"

# cdylib for embedding the daemon in the app process (Android): on targetSdk >=
# 29 an app cannot execve an ELF from its own data dir (SELinux W^X), so the app
# dlopens `libprivetd_embed.so` and runs the daemon on a thread instead.
# Name differs from the bin to avoid output/Pdb collisions on Windows.
[lib]
name = "privetd_embed"
crate-type = ["cdylib"]

[dependencies]
privet-core = { path = "../privet-core" }
privet-ipc = { path = "../privet-ipc" }
privet-discovery = { path = "../privet-discovery" }
privet-security = { path = "../privet-security" }
privet-storage = { path = "../privet-storage" }
privet-transfer = { path = "../privet-transfer" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

# JNI bridge for the embedded daemon; only needed when building for Android.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
