[workspace]
resolver = "2"
members = ["privet-protocol", "privet-transport", "privet-crypto"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# protocol
prost = "0.14"
prost-build = "0.14"
bytes = "1"

# crypto
rcgen = { version = "0.13", features = ["pem", "ring"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "zeroize"] }
spake2 = "0.4"
rand = "0.8"
getrandom = "0.2"
zeroize = "1"

# hash
blake3 = "1"

# transport
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
async-trait = "0.1"

# discovery
socket2 = "0.5"

# utils
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
bincode = "1"
serde = { version = "1", features = ["derive"] }
time = "0.3"
thiserror = "1"

# trace
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"

# dev-only
proptest = "1"
tempfile = "3"
x509-cert = "0.2"
der = "0.7"
