[workspace]
members = ["privet-core", "privet-ffi", "privet-cli", "privet-tests"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# QUIC (stable crates.io release)
quinn = { version = "0.11", default-features = false }
quinn-proto = { version = "0.11", default-features = false }

# TLS
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem"] }
rustls-pemfile = { version = "2", default-features = false, features = ["std"] }

# Async
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "parking_lot", "rt-multi-thread", "time", "fs", "signal"] }
tokio-util = { version = "0.7", default-features = false }

# Serialization
serde = { version = "1", default-features = false, features = ["derive", "std"] }
postcard = { version = "1", features = ["alloc"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

# Error handling
thiserror = { version = "2", default-features = false }
eyre = { version = "0.6" }

# Logging
log = { version = "0.4" }
tracing = { version = "0.1", default-features = false, features = ["log"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["tracing-log", "std", "fmt", "env-filter"] }

# Utilities
bytes = { version = "1", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["serde", "std", "v4"] }
sha2 = { version = "0.10", default-features = false }

# Discovery
mdns-sd = { version = "0.11", default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
dirs = "6"
if-addrs = "0.12"
hostname = "0.4"
toml = "0.8"
ipnet = { version = "2", features = ["serde"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "warn"
cast_lossless = "warn"
ptr_as_ptr = "warn"
missing_safety_doc = "warn"
cloned_instead_of_copied = "warn"

[profile.release]
opt-level = "z"
debug = 1
lto = "fat"
strip = true
incremental = false
codegen-units = 1
