[package]
name = "privet-cli"
description = "CLI interface for privet LAN file transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "privet"
path = "src/main.rs"

[features]
default = ["aws-lc-rs"]
ring = ["privet-core/ring"]
aws-lc-rs = ["privet-core/aws-lc-rs"]

[dependencies]
privet-core = { path = "../privet-core" }
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
eyre = { workspace = true }
hostname = { workspace = true }

[lints]
workspace = true
