syntax = "proto3";
package privet.storage.v1;

// Versioned, self-contained resume metadata. It does not depend on the wire schema.
// Stored beside the partial file under <save_dir>/.privet/<transfer_id>/.

message PartMeta {
  string transfer_id = 1;
  string file_id = 2;
  string relative_path = 3;   // Sanitized relative path.
  uint64 size = 4;
  uint64 mtime_ms = 5;
  string hash_type = 6;
  string hash_value = 7;
  repeated PartSegment segments = 8;
}

message PartSegment {
  uint32 segment_id = 1;
  uint64 offset = 2;
  uint64 length = 3;
  uint32 chunk_count = 4;
  uint32 chunk_size = 5;
  string hash_type = 6; 
  repeated string chunk_hash_values = 7; // Per-chunk BLAKE3 hex; empty before the manifest arrives.
  string segment_hash_value = 8; // Segment-root BLAKE3 hex; empty before the manifest arrives.
}
