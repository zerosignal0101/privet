[package]
name = "privet-core"
description = "Core engine for privet LAN file transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["aws-lc-rs"]
ring = ["rustls/ring", "tokio-rustls/ring", "quinn/rustls-ring", "rcgen/ring"]
aws-lc-rs = ["rustls/aws-lc-rs", "tokio-rustls/aws-lc-rs", "quinn/rustls-aws-lc-rs", "rcgen/aws_lc_rs"]

[dependencies]
# QUIC
quinn = { workspace = true, default-features = false, features = ["runtime-tokio"] }
quinn-proto = { workspace = true }

# TLS
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }

# Serialization
serde = { workspace = true }
postcard = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
eyre = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
bytes = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
ipnet = { workspace = true }

# Discovery
mdns-sd = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
